<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что нового · здоровье</title>
<link rel="stylesheet" href="common.css">
<style>
.back{display:inline-block;color:var(--text-secondary);text-decoration:none;font-size:13px;margin:2px 0 4px}
.back:hover{color:var(--text-primary)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:16px;max-width:760px}
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
<nav class="nav" id="nav"></nav>
<a class="back" id="back" href="dashboard.html" title="Вернуться (Esc)">← Сводка</a>
<header><div><h1>Что нового</h1><div class="sub" id="sub"></div></div></header>
<div id="outside" class="card" hidden><h2>История версий есть только в приложении «Здоровье»</h2></div>
<div id="list" class="card wn-page" hidden></div>
</div>
</div>
<script src="../data/data.js"></script>
<script src="dataset.js"></script>
<script src="nav.js"></script>
<script src="whatsnew.js"></script>
<script>
(function () {
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  const $ = s => document.querySelector(s);
  let last = null; try { last = sessionStorage.getItem('navLast'); } catch (e) {}
  const b = WhatsNew.back(last), a = $('#back');                    // назад — туда, откуда пришли
  a.href = b.href; a.textContent = '← ' + b.title;
  a.onclick = e => { if (b.history && history.length > 1) { e.preventDefault(); history.back(); } };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('dialog[open]')) a.click(); });
  if (!window.health) { $('#outside').hidden = false; return; }
  window.health.whatsNewSeen();                       // открыли историю — окно в этот запуск больше не нужно
  window.health.changelog().then(r => {
    $('#sub').textContent = 'Сейчас установлена версия ' + r.version;
    $('#list').innerHTML = r.releases.length ? WhatsNew.html(r.releases) : '<div class="muted">Записей пока нет</div>';
    $('#list').hidden = false;
  });
})();
</script>
</body>
</html>
