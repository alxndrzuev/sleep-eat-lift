<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что нового · SEL</title>
<link rel="stylesheet" href="common.css">
<style>
header{max-width:760px;align-items:flex-start}
#title{display:flex;align-items:center;gap:10px}
.close{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;flex:none;
  color:var(--text-secondary);text-decoration:none;font-size:17px;line-height:1;border:1px solid var(--border);background:var(--surface-1)}
.close:hover{color:var(--text-primary);border-color:var(--text-secondary)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:16px;max-width:760px}
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
<header><div><h1 id="title">Что нового в SEL</h1><div class="sub" id="sub"></div></div>
<a class="close" id="back" href="dashboard.html" title="Закрыть (Esc)" aria-label="Закрыть">✕</a></header>
<div id="outside" class="card" hidden><h2>История версий есть только в приложении SEL</h2></div>
<div id="list" class="card wn-page" hidden></div>
</div>
</div>
<script src="../data/data.js"></script>
<script src="dataset.js"></script>
<script src="nav.js"></script>     <!-- меню на этой странице нет: только Nav.title для крестика -->
<script src="whatsnew.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  $('#title').insertAdjacentHTML('afterbegin', Nav.mark(30));
  let last = null; try { last = sessionStorage.getItem('navLast'); } catch (e) {}
  const b = WhatsNew.back(last), a = $('#back');                    // крестик — назад, туда, откуда пришли
  a.href = b.href; a.title = 'Закрыть и вернуться в «' + b.title + '» (Esc)';
  a.onclick = e => { if (b.history && history.length > 1) { e.preventDefault(); history.back(); } };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('dialog[open]')) a.click(); });
  if (!window.health) { $('#outside').hidden = false; return; }
  window.health.whatsNewSeen();                       // открыли историю — окно в этот запуск больше не нужно
  window.health.changelog().then(r => {
    $('#sub').textContent = 'Сейчас установлена версия ' + r.version;
    $('#list').innerHTML = r.releases.length ? WhatsNew.html(r.releases) : '<div class="muted">Записей пока нет</div>';
    $('#list').hidden = false;
  });
})();
</script>
</body>
</html>
